[project]
name = "weclapp-api-knowledge-mcp"
version = "0.1.0"
description = "Knowledge-first MCP server for researching the weclapp API and validating read patterns against a tenant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.32.0",
    "weclappy>=0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
weclapp-api-knowledge-mcp = "weclapp_api_knowledge_mcp.server:main"
weclapp-build-indexes = "weclapp_api_knowledge_mcp.build_indexes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weclapp_api_knowledge_mcp"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
