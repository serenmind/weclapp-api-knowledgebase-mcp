[project]
name = "weclapp-api-knowledge-mcp"
version = "0.1.0"
description = "Knowledge-first MCP server for researching the weclapp API and validating read patterns against a tenant."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "weclapp", "erp", "openapi", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.32.0",
    "weclappy>=0.4.1",
]

[project.urls]
Homepage = "https://github.com/serenmind/weclapp-api-knowledgebase-mcp"
Repository = "https://github.com/serenmind/weclapp-api-knowledgebase-mcp"
Issues = "https://github.com/serenmind/weclapp-api-knowledgebase-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
weclapp-api-knowledge-mcp = "weclapp_api_knowledge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weclapp_api_knowledge_mcp"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
